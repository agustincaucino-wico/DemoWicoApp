name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel a superseded run (e.g. a fresh push to the same PR) instead of
# letting both burn through CI minutes.
concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres is the only DB engine used across all settings modules
    # (dev/local/prod all set ENGINE=django.db.backends.postgresql). No
    # major version is pinned anywhere in the repo or in prod's
    # docker-compose.yml (the app connects to an external DB host, not a
    # container), so this defaults to 15 - bump the tag below if you know
    # the actual server version.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wico_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: myapp.settings.test
      # Disposable value for an ephemeral CI database - never touches
      # real user data, so it doesn't need to be a GitHub secret.
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_NAME: wico_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: app
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: app
        run: pytest
