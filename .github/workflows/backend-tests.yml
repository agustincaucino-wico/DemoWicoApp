name: Backend Tests

on:
  push:
    # PROD is included so the test job also runs (and gates deploy-prod
    # below) on pushes to PROD, not just main.
    branches: [ main, PROD ]
  pull_request:
    branches: [ main ]

# Cancel a superseded run (e.g. a fresh push to the same PR) instead of
# letting both burn through CI minutes.
concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres is the only DB engine used across all settings modules
    # (dev/local/prod all set ENGINE=django.db.backends.postgresql). Real
    # server version is confirmed as 17.9.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wico_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: myapp.settings.test
      # Disposable value for an ephemeral CI database - never touches
      # real user data, so it doesn't need to be a GitHub secret.
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_NAME: wico_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: app
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: app
        run: pytest

  # Deploy jobs live in this same workflow (instead of a separate
  # deploy.yml with its own `on: push` trigger) specifically so `needs: test`
  # can gate them: needs: only works between jobs within one workflow file.
  # If the test job fails (or is skipped/cancelled), GitHub Actions skips
  # any job that needs: it by default - no extra `if:` check required.
  deploy-test:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Test Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/myapp/backend
            git pull origin main
            docker-compose build backend
            docker-compose up -d backend

  deploy-prod:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/PROD'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Prod Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP_PROD }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/myapp/backend
            git pull origin PROD
            docker-compose build backend
            docker-compose up -d backend

  # Fires only when test actually fails on a direct push to main/PROD (not
  # on PRs, not on skip/cancel) - branch protection isn't available on this
  # repo (no admin access), so this is the closest thing to a guaranteed
  # "someone finds out" signal when a broken push slips past a developer's
  # own testing and lands on a branch that's supposed to gate deploy.
  alert-on-failure:
    needs: test
    if: failure() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/PROD')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failure on push to ${branch} - deploy skipped`,
              body: [
                `@${context.actor} pushed a commit to \`${branch}\` and the test suite failed.`,
                '',
                `Deploy was **skipped** as a result - the deploy job for this branch only runs when tests pass.`,
                '',
                `Failed run: ${runUrl}`,
              ].join('\n'),
              labels: ['ci-failure'],
            });
