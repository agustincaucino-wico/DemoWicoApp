openapi: 3.0.3
info:
  title: Wico App API
  version: 0.0.1
  description: API para aplicación Wico
paths:
  /accounts/accounts/:
    get:
      operationId: accounts_accounts_list
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
          description: ''
    post:
      operationId: accounts_accounts_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Account'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Account'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /accounts/accounts/{id}/:
    delete:
      operationId: accounts_accounts_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /accounts/accounts/{id}/update-balance/:
    patch:
      operationId: accounts_accounts_update_balance_partial_update
      description: Actualiza el balance de una cuenta específica.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account.
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountBalanceUpdate'
            examples:
              EjemploDeActualizaciónDeBalance:
                value:
                  balance: 1000.5
                summary: Ejemplo de actualización de balance
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountBalanceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountBalanceUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceUpdate'
          description: ''
  /accounts/authorized-plates/:
    get:
      operationId: accounts_authorized_plates_list
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizedPlate'
          description: ''
    post:
      operationId: accounts_authorized_plates_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizedPlate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorizedPlate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthorizedPlate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedPlate'
          description: ''
  /accounts/authorized-plates/{id}/:
    delete:
      operationId: accounts_authorized_plates_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this authorized plate.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /accounts/companies/:
    get:
      operationId: accounts_companies_list
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
          description: ''
    post:
      operationId: accounts_companies_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Company'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Company'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /accounts/companies/{id}/:
    delete:
      operationId: accounts_companies_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this company.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /accounts/company-assignments/:
    get:
      operationId: accounts_company_assignments_list
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyAssignment'
          description: ''
    post:
      operationId: accounts_company_assignments_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyAssignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyAssignment'
          description: ''
  /accounts/company-assignments/{id}/:
    delete:
      operationId: accounts_company_assignments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this company assignment.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /accounts/dependent-invitations/:
    get:
      operationId: accounts_dependent_invitations_list
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DependentInvitation'
          description: ''
    post:
      operationId: accounts_dependent_invitations_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependentInvitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DependentInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DependentInvitation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentInvitation'
          description: ''
  /accounts/dependent-invitations/{id}/:
    delete:
      operationId: accounts_dependent_invitations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this dependent invitation.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /accounts/dependents/:
    get:
      operationId: accounts_dependents_list
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dependents'
          description: ''
    post:
      operationId: accounts_dependents_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dependents'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Dependents'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Dependents'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependents'
          description: ''
  /accounts/dependents/{id}/:
    delete:
      operationId: accounts_dependents_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this dependents.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /accounts/plates/:
    get:
      operationId: accounts_plates_list
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plates'
          description: ''
    post:
      operationId: accounts_plates_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plates'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Plates'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Plates'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plates'
          description: ''
  /accounts/plates/{id}/:
    delete:
      operationId: accounts_plates_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plates.
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /actions/fuel-load/attendant/cancel-load/{operation_id}/:
    post:
      operationId: actions_fuel_load_attendant_cancel_load_create
      description: Attendant cancels a fuel load operation with a reason.
      summary: Cancel Fuel Load by Attendant
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - actions - fuel load - attendant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelFuelLoadResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelFuelLoadResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelFuelLoadResponse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                message: Operación cancelada exitosamente
          description: ''
        '404':
          description: No response body
        '400':
          description: No response body
  /actions/fuel-load/attendant/confirm-load/:
    post:
      operationId: actions_fuel_load_attendant_confirm_load_create
      description: Attendant completes a fuel load operation. Changes status to completed,
        sets timestamp_finished, and deducts the amount from the account balance.
      summary: Complete Fuel Load
      tags:
      - actions - fuel load - attendant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteFuelLoad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompleteFuelLoad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompleteFuelLoad'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelLoadOperation'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
  /actions/fuel-load/attendant/pending-loads/:
    get:
      operationId: actions_fuel_load_attendant_pending_loads_list
      description: Get pending and in-progress fuel loads for the attendant's assigned
        station.
      summary: Get Pending Loads
      tags:
      - actions - fuel load - attendant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingFuelLoad'
          description: ''
  /actions/fuel-load/attendant/start-fuel-load/:
    post:
      operationId: actions_fuel_load_attendant_start_fuel_load_create
      description: Attendant starts processing a fuel load. Changes status to in_progress
        and sets timestamp_atended.
      summary: Start Fuel Load
      tags:
      - actions - fuel load - attendant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFuelLoad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartFuelLoad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartFuelLoad'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelLoadOperation'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
  /actions/fuel-load/cancel-fuel-load/{operation_id}/:
    post:
      operationId: actions_fuel_load_cancel_fuel_load_create
      description: Client cancels a pending fuel load operation.
      summary: Cancel Fuel Load
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - actions - fuel load - client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelFuelLoadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelFuelLoadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelFuelLoadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelFuelLoadResponse'
          description: ''
        '404':
          description: No response body
        '400':
          description: No response body
  /actions/fuel-load/cancel-waiting/:
    post:
      operationId: actions_fuel_load_cancel_waiting_create
      description: Client cancels waiting for attendant without a message.
      summary: Cancel Waiting for Attendant
      tags:
      - actions - fuel load - client
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelFuelLoadResponse'
          description: ''
        '404':
          description: No response body
        '400':
          description: No response body
  /actions/fuel-load/check-last-operation-status/:
    get:
      operationId: actions_fuel_load_check_last_operation_status_retrieve
      description: Check the status, operation ID, final amount, and other details
        of a fuel load operation.
      summary: Check Operation Status
      tags:
      - actions - fuel load - client
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckOperationStatus'
          description: ''
        '404':
          description: No response body
  /actions/fuel-load/get-fuel-load-status/{operation_id}/:
    get:
      operationId: actions_fuel_load_get_fuel_load_status_retrieve
      description: Attendant checks the status of a specific fuel load operation by
        operation ID.
      summary: Get Fuel Load Status
      parameters:
      - in: path
        name: operation_id
        schema:
          type: integer
        required: true
      tags:
      - actions - fuel load - attendant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelLoadStatus'
          description: ''
        '404':
          description: No response body
        '403':
          description: No response body
  /actions/fuel-load/initiate-fuel-load/:
    post:
      operationId: actions_fuel_load_initiate_fuel_load_create
      description: Client initiates a fuel load operation. Creates FuelLoadOperation
        with pending or no_balance status.
      summary: Initiate Fuel Load
      tags:
      - actions - fuel load - client
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateFuelLoad'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitiateFuelLoad'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitiateFuelLoad'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelLoadOperation'
          description: ''
        '400':
          description: No response body
  /actions/info/:
    get:
      operationId: actions_info_retrieve
      description: Get user account information including accounts, dependents, plates,
        and company
      summary: Get User Account Info
      tags:
      - actions
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /actions/invitations/cancel/:
    post:
      operationId: actions_invitations_cancel_create
      description: Cancel a pending invitation
      summary: Cancel Invitation
      tags:
      - actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInvitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelInvitation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /actions/invitations/create/:
    post:
      operationId: actions_invitations_create_create
      description: Create a new dependent invitation
      summary: Create Dependent Invitation
      tags:
      - actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateInvitation'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentInvitation'
          description: ''
        '400':
          description: No response body
  /actions/invitations/list/:
    get:
      operationId: actions_invitations_list_retrieve
      description: Get all invitations (sent and received) for the user
      summary: Get User Invitations (sent and received)
      tags:
      - actions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationsListResponse'
          description: ''
  /actions/invitations/respond/{invitation_id}/:
    post:
      operationId: actions_invitations_respond_create
      description: Respond to a dependent invitation (accept or reject)
      summary: Respond to Invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: integer
        description: ID of the invitation to respond to
        required: true
      tags:
      - actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationResponse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentInvitation'
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /actions/remove-dependent/:
    post:
      operationId: actions_remove_dependent_create
      description: Remove a dependent user from a holder account
      summary: Remove Dependent
      tags:
      - actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDependent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RemoveDependent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RemoveDependent'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '404':
          description: No response body
        '500':
          description: No response body
  /actions/user/plates/:
    get:
      operationId: actions_user_plates_list
      description: Get all plates accessible by the user, including owned plates and
        authorized plates (both active and inactive).
      summary: Get User Plates
      tags:
      - actions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPlate'
          description: ''
  /api/token/:
    post:
      operationId: api_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/token/verify/:
    post:
      operationId: api_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /locations/addresses/:
    get:
      operationId: locations_addresses_list
      description: API endpoint that allows addresses to be created, viewed or deleted.
      tags:
      - locations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
          description: ''
    post:
      operationId: locations_addresses_create
      description: API endpoint that allows addresses to be created, viewed or deleted.
      tags:
      - locations
      requestBody:
        content:
          application/json:
