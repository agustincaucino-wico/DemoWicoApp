            * `in_progress` - En progreso
            * `resolved` - Resuelto
            * `closed` - Cerrado
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - category_display
      - created_at
      - description
      - id
      - status_display
      - updated_at
      - user
      - user_email
    ErrorReportStatusEnum:
      enum:
