components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
      required:
      - account_type
      - balance
      - created_at
      - id
      - updated_at
    AccountTypeEnum:
      enum:
      - holder
      - dependent
      type: string
      description: |-
        * `holder` - Titular
        * `dependent` - Adherido
    ActionEnum:
      enum:
      - accept
      - reject
      type: string
      description: |-
        * `accept` - accept
        * `reject` - reject
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        street:
          type: string
          maxLength: 100
        number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        floor:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        apartment:
          type: string
          nullable: true
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - id
      - number
      - street
    AuthorizedPlate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        dependent_account:
          type: integer
        plate:
          type: integer
      required:
      - dependent_account
      - id
      - plate
      - start_date
    CancelInvitation:
      type: object
      properties:
        holder_account_id:
          type: integer
          description: ID of the holder account that sent the invitation
        dependent_email:
          type: string
          format: email
          description: Email of the user whose invitation should be cancelled
      required:
      - dependent_email
      - holder_account_id
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        province:
          type: integer
      required:
      - id
      - name
      - province
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        province:
          type: integer
      required:
      - id
      - name
      - province
    CompanyAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        user:
          type: integer
        company:
          type: integer
      required:
      - company
      - id
      - start_date
      - user
    Country:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    CreateInvitation:
      type: object
      properties:
        holder_account_id:
          type: integer
          description: ID of the holder account sending the invitation
        dependent_email:
          type: string
          format: email
          description: Email of the user to be invited as a dependent
      required:
      - dependent_email
      - holder_account_id
    DependentInvitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        holder_account:
          type: integer
        dependent_email:
          type: string
          format: email
          maxLength: 254
        invitation_date:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        response_date:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        holder_account_email:
          type: string
          readOnly: true
        holder_account_name:
          type: string
          readOnly: true
      required:
      - holder_account
      - holder_account_email
      - holder_account_name
      - id
      - invitation_date
      - response_date
    Dependents:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        holder_account:
          type: integer
        dependent_account:
          type: integer
      required:
      - dependent_account
      - holder_account
      - id
      - start_date
    GenderEnum:
      enum:
      - M
      - F
      - X
      type: string
      description: |-
        * `M` - Masculino
        * `F` - Femenino
        * `X` - No binario
    InvitationResponse:
      type: object
      properties:
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          description: |-
            Action to take on the invitation: 'accept' or 'reject'

            * `accept` - accept
            * `reject` - reject
      required:
      - action
    InvitationsListResponse:
      type: object
      properties:
        sent_invitations:
          type: array
          items:
            $ref: '#/components/schemas/DependentInvitation'
          description: List of invitations sent by the user's holder accounts
        received_invitations:
          type: array
          items:
            $ref: '#/components/schemas/DependentInvitation'
          description: List of invitations received by the user's email
      required:
      - received_invitations
      - sent_invitations
    PatchedSetting:
      type: object
      properties:
        user:
          type: integer
          readOnly: true
        push_notif:
          type: boolean
        email_notif:
          type: boolean
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          nullable: true
          maxLength: 30
        last_name:
          type: string
          nullable: true
          maxLength: 30
        dni:
          type: string
          maxLength: 20
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        id_province:
          type: integer
          nullable: true
        province_name:
          type: string
          nullable: true
          readOnly: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
        groups:
          type: array
          items:
            type: string
          readOnly: true
    Plates:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plate_number:
          type: string
          maxLength: 10
        brand:
          type: string
          nullable: true
          maxLength: 50
        model:
          type: string
          nullable: true
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        holder_account:
          type: integer
      required:
      - holder_account
      - id
      - plate_number
      - start_date
    Province:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        country:
          type: integer
      required:
      - country
      - id
      - name
    RemoveDependent:
      type: object
      properties:
        holder_account_id:
          type: integer
          description: ID of the holder account to remove the dependent from
        dependent_account_id:
          type: integer
          description: ID of the dependent account to be removed
      required:
      - dependent_account_id
      - holder_account_id
    Setting:
      type: object
      properties:
        user:
          type: integer
          readOnly: true
        push_notif:
          type: boolean
        email_notif:
          type: boolean
      required:
      - user
    Station:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        province:
          type: integer
        province_name:
          type: string
          readOnly: true
        city:
          type: integer
        city_name:
          type: string
          readOnly: true
        street:
          type: string
          maxLength: 255
        street_number:
          type: string
          maxLength: 10
      required:
      - city
      - id
      - name
      - province
      - street
      - street_number
    StationAttendantAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attendant:
          type: integer
        attendant_email:
          type: string
          format: email
          readOnly: true
        attendant_full_name:
          type: string
          readOnly: true
        station:
          type: integer
        station_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
      required:
      - attendant
      - attendant_email
      - attendant_full_name
      - id
      - start_date
      - station
      - station_name
    StatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - Pendiente
        * `accepted` - Aceptada
        * `rejected` - Rechazada
        * `cancelled` - Cancelada
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          nullable: true
          maxLength: 30
        last_name:
          type: string
          nullable: true
          maxLength: 30
        dni:
          type: string
          maxLength: 20
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        id_province:
          type: integer
          nullable: true
        province_name:
          type: string
          nullable: true
          readOnly: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
        groups:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - dni
      - email
      - groups
      - id
      - password
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
