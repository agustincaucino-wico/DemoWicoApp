components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
      required:
      - account_type
      - balance
      - created_at
      - id
      - updated_at
    AccountTypeEnum:
      enum:
      - holder
      - dependent
      type: string
      description: |-
        * `holder` - Holder
        * `dependent` - Dependent
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        street:
          type: string
          maxLength: 100
        number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        floor:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        apartment:
          type: string
          nullable: true
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - id
      - number
      - street
    AuthorizedPlate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        holder_account:
          type: integer
        dependent_account:
          type: integer
        plate:
          type: integer
      required:
      - dependent_account
      - holder_account
      - id
      - plate
      - start_date
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        province:
          type: integer
      required:
      - id
      - name
      - postal_code
      - province
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        province:
          type: integer
      required:
      - id
      - name
      - province
    CompanyAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        user:
          type: integer
        company:
          type: integer
      required:
      - company
      - id
      - start_date
      - user
    Country:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    Dependents:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        holder_account:
          type: integer
        dependent_account:
          type: integer
      required:
      - dependent_account
      - holder_account
      - id
      - start_date
    GenderEnum:
      enum:
      - M
      - F
      - X
      type: string
      description: |-
        * `M` - Masculino
        * `F` - Femenino
        * `X` - No binario
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          nullable: true
          maxLength: 30
        last_name:
          type: string
          nullable: true
          maxLength: 30
        dni:
          type: string
          maxLength: 20
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        id_province:
          type: integer
          nullable: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
    Plates:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plate_number:
          type: string
          maxLength: 10
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        holder_account:
          type: integer
      required:
      - holder_account
      - id
      - plate_number
      - start_date
    Province:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
