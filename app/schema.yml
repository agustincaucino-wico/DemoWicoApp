          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        holder_account:
          type: integer
        dependent_account:
          type: integer
      required:
      - dependent_account
      - holder_account
      - id
      - start_date
    ErrorReport:
      type: object
