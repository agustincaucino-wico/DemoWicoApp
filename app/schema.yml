components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
      required:
      - account_type
      - balance
      - created_at
      - id
      - updated_at
    AccountBalanceUpdate:
      type: object
      description: Serializer específico para actualizar solo el balance de una cuenta
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - balance
    AccountTypeEnum:
      enum:
      - holder
      - dependent
      type: string
      description: |-
        * `holder` - Titular
        * `dependent` - Adherido
    ActionEnum:
      enum:
      - accept
      - reject
      type: string
      description: |-
        * `accept` - accept
        * `reject` - reject
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        street:
          type: string
          maxLength: 100
        number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        floor:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        apartment:
          type: string
          nullable: true
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - id
      - number
      - street
    AuthorizedPlate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        dependent_account:
          type: integer
        plate:
          type: integer
      required:
      - dependent_account
      - id
      - plate
      - start_date
    CancelFuelLoadRequest:
      type: object
      properties:
        message:
          type: string
          nullable: true
    CancelFuelLoadResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    CancelInvitation:
      type: object
      properties:
        holder_account_id:
          type: integer
          description: ID of the holder account that sent the invitation
        dependent_email:
          type: string
          format: email
          description: Email of the user whose invitation should be cancelled
      required:
      - dependent_email
      - holder_account_id
    CategoryEnum:
      enum:
      - login
      - balance
      - fuel_load
      - transactions
      - other
      type: string
      description: |-
        * `login` - Inicio de sesión
        * `balance` - Saldo y pagos
        * `fuel_load` - Carga de combustible
        * `transactions` - Movimientos
        * `other` - Otro problema
    CheckOperationStatus:
      type: object
      properties:
        status:
          type: string
        operation_id:
          type: integer
        final_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        initial_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        station_name:
          type: string
          nullable: true
        plate:
          type: string
          nullable: true
      required:
      - balance
      - final_amount
      - initial_amount
      - operation_id
      - plate
      - station_name
      - status
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        province:
          type: integer
      required:
      - id
      - name
      - province
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        province:
          type: integer
      required:
      - id
      - name
      - province
    CompanyAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        user:
          type: integer
        company:
          type: integer
      required:
      - company
      - id
      - start_date
      - user
