components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        street:
          type: string
          maxLength: 100
        number:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        floor:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        apartment:
          type: string
          nullable: true
          maxLength: 10
        city:
          type: integer
      required:
      - city
      - id
      - number
      - street
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        province:
          type: integer
      required:
      - id
      - name
      - postal_code
      - province
    Country:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    GenderEnum:
      enum:
      - M
      - F
      - X
      type: string
      description: |-
        * `M` - Masculino
        * `F` - Femenino
        * `X` - No binario
    PatchedUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          nullable: true
          maxLength: 30
        last_name:
          type: string
          nullable: true
          maxLength: 30
        dni:
          type: string
          maxLength: 20
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        id_province:
          type: integer
          nullable: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
    Province:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        country:
          type: integer
      required:
      - country
      - id
      - name
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          nullable: true
          maxLength: 30
        last_name:
          type: string
          nullable: true
          maxLength: 30
        dni:
          type: string
          maxLength: 20
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        id_province:
          type: integer
          nullable: true
        gender:
          $ref: '#/components/schemas/GenderEnum'
      required:
      - dni
      - email
      - id
      - password
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
