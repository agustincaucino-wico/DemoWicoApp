          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /locations/addresses/{id}/:
    delete:
      operationId: locations_addresses_destroy
      description: API endpoint that allows addresses to be created, viewed or deleted.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this address.
        required: true
      tags:
      - locations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
